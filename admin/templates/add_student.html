{% extends "base.html" %}

{% block title %}Add Student - Grade {{ grade }} Section {{ section }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden relative">
  <!-- Back button -->
  <div class="relative">
    <a onclick="loading_back();" class="absolute top-4 left-4 z-10 cursor-pointer">
      <img src="{{ url_for('static', filename='img/back.svg') }}" alt="Back" class="w-10">
    </a>
    <div class="w-full h-40 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-t-2xl flex items-center justify-center">
      <h2 class="text-white text-2xl font-bold">Add Student</h2>
    </div>
  </div>

  <div class="p-6">
    <p class="text-gray-600 mb-6 text-center">Adding to <strong>Grade {{ grade }} - Section {{ section }}</strong></p>
    <form action="/admin/panal/add_student/{{ grade }}/{{ section }}" method="post" onsubmit="loading_animation();" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
        <input name="fname" type="text" placeholder="First Name" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Middle Name</label>
        <input name="mname" type="text" placeholder="Middle Name" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
        <input name="lname" type="text" placeholder="Last Name" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
        <select name="gender" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">Select Gender</option>
          <option value="M">Male</option>
          <option value="F">Female</option>
        </select>
      </div>

      <!-- Parent Information -->
      <div class="border-t border-gray-200 pt-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Parent / Guardian Details</label>
        <div class="space-y-2">
          <input name="parent_phone" type="text" placeholder="Parent Phone Number"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input name="parent_email" type="email" placeholder="Parent Email Address"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input name="parent_hous_number" type="number" min="1" placeholder="House Number (required)" required
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <p class="text-xs text-gray-400 mt-1">Parent name is automatically set from the student's middle & last name.</p>
      </div>
      <div class="pt-4 text-center">
        <input type="submit" value="Add Student"
               class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-6 rounded-lg cursor-pointer transition shadow-md">
      </div>
    </form>
  </div>
</div>
{% endblock %}
