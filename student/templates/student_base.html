<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Student Portal{% endblock %} - Nur Al-Huda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>body { font-family: 'Inter', sans-serif; }</style>
  {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="container mx-auto px-4">
      <div class="flex justify-between items-center py-3">
        <div class="flex items-center space-x-4">
          <a href="/student/dashboard">
            <img src="{{ url_for('static', filename='img/logo.avif') }}" alt="Logo" class="h-10">
          </a>
          <div class="hidden md:flex space-x-1">
            <a href="/student/dashboard" class="px-3 py-2 rounded-md text-sm font-medium transition {{ 'bg-blue-50 text-blue-700' if active_page == 'dashboard' else 'text-gray-700 hover:bg-gray-100' }}">
              Dashboard
            </a>
            <a href="/student/grades" class="px-3 py-2 rounded-md text-sm font-medium transition {{ 'bg-blue-50 text-blue-700' if active_page == 'grades' else 'text-gray-700 hover:bg-gray-100' }}">
              My Grades & Report
            </a>
            <a href="/student/resources" class="px-3 py-2 rounded-md text-sm font-medium transition {{ 'bg-blue-50 text-blue-700' if active_page == 'resources' else 'text-gray-700 hover:bg-gray-100' }}">
              Materials & Books
            </a>
            <a href="/student/profile" class="px-3 py-2 rounded-md text-sm font-medium transition {{ 'bg-blue-50 text-blue-700' if active_page == 'profile' else 'text-gray-700 hover:bg-gray-100' }}">
              My Profile
            </a>
          </div>
        </div>
        <div class="flex items-center space-x-3">
          <span class="text-sm font-semibold text-gray-700 hidden sm:inline">{{ session.get('username') }}</span>
          <a href="/logout" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm transition">Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-grow container mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-white border-t border-gray-200 py-4 mt-8">
    <div class="container mx-auto text-center text-gray-500 text-sm">
      &copy; 2026 Nur Al-Huda School Management System. Student Portal.
    </div>
  </footer>
  <script src="{{ url_for('static', filename='js/action.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
